
name: Wheel Analyzer APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK yolunu bul
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort -V | tail -n 1)
          fi
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

      - name: SDK lisanslarını kabul et
        run: |
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" --licenses

      - name: Android paketlerini yükle
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Gradle kur
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.9'

      - name: APK oluştur
        run: gradle assembleDebug

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: WheelAnalyzer-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
